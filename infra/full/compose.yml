version: "3.8"

services:
  database:
    image: timescale/timescaledb@sha256:51eb3bcdfc41f481c797026813d9d457fb5cbc8ea370a65640d8cda13a4040c1
    restart: unless-stopped
    environment:
      POSTGRES_USER: praxis_cluster_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/praxis_db_admin_password
      NO_TS_TUNE: "true"
    secrets:
      - praxis_db_admin_password
      - praxis_db_password
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/010-praxis-control.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis_cluster_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  application:
    image: praxis-control-full:0.1.0
    build:
      context: ../..
      dockerfile: infra/full/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      - database
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 4310
      PRAXIS_DATA_DIR: /tmp/praxis-control
      XDG_RUNTIME_DIR: /tmp/praxis-runtime
      DATABASE_MODE: postgres
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: praxis_control
      DATABASE_USER: praxis_control
      DATABASE_PASSWORD_FILE: /run/secrets/praxis_db_password
      DATABASE_SSL: "false"
      ACCESS_MODE: ${ACCESS_MODE:-password}
      TAILSCALE_ALLOWED_USER: ${TAILSCALE_ALLOWED_USER:-}
      ACCESS_PASSWORD_FILE: /run/secrets/praxis_access_password
      SESSION_SECRET_FILE: /run/secrets/praxis_session_secret
      SESSION_COOKIE_SECURE: "true"
      RUN_MIGRATIONS: "true"
      RULESET_VERSION: 2026.07.28-mvp1
    secrets:
      - praxis_db_password
      - praxis_access_password
      - praxis_session_secret
    ports:
      - "127.0.0.1:${PRAXIS_BIND_PORT:-4310}:4310"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700
      - /data:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - backend
      - edge

volumes:
  database-data:

networks:
  backend:
    internal: true
  edge:

secrets:
  praxis_db_admin_password:
    file: ${PRAXIS_DB_ADMIN_PASSWORD_FILE:-./secrets/database-admin-password.txt}
  praxis_db_password:
    file: ${PRAXIS_DB_PASSWORD_FILE:-./secrets/database-app-password.txt}
  praxis_access_password:
    file: ${PRAXIS_ACCESS_PASSWORD_FILE:-./secrets/access-password.txt}
  praxis_session_secret:
    file: ${PRAXIS_SESSION_SECRET_FILE:-./secrets/session-secret.txt}
