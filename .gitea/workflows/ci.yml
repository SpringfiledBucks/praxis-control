name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  linux-gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:linux-client
      - name: Install GTK runtime for headless smoke test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gir1.2-adw-1 gir1.2-gtk-4.0 gir1.2-soup-3.0 xvfb xauth dbus-x11
      - name: Launch GTK shell under Xvfb
        run: xvfb-run -a dbus-run-session -- gjs -m clients/linux/src/app.mjs --smoke-test

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxis_test
          POSTGRES_PASSWORD: praxis_test_password
          POSTGRES_DB: praxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis_test -d praxis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: postgresql://praxis_test:praxis_test_password@127.0.0.1:5432/praxis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
