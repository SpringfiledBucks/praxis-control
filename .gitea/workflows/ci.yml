name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: praxis-control-ci:node24-gtk4-v1
    steps:
      - name: Checkout authoritative commit
        env:
          GITEA_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin http://<NAS_LAN_IP>:3000/<GITEA_OWNER>/praxis-control.git
          git -c http.extraheader="Authorization: token $GITEA_TOKEN" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Validate full-profile shell entrypoints
        run: sh -n infra/full/init-database.sh infra/full/manage.sh infra/full/backup.sh infra/full/render-nginx.sh infra/full/tests/credential-guard.sh infra/full/tests/nginx-config.sh infra/full/tests/smoke.sh
      - name: Validate Git mirror shell entrypoints
        run: bash -n infra/git-mirror/github-mirror-sync.sh && sh -n infra/git-mirror/post-receive

  linux-gui-smoke:
    runs-on: ubuntu-latest
    container:
      image: praxis-control-ci:node24-gtk4-v1
    steps:
      - name: Checkout authoritative commit
        env:
          GITEA_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin http://<NAS_LAN_IP>:3000/<GITEA_OWNER>/praxis-control.git
          git -c http.extraheader="Authorization: token $GITEA_TOKEN" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm run build
      - run: npm run test:linux-client
      - name: Launch GTK shell under Xvfb
        run: clients/linux/tests/run-with-xvfb.sh npm run test:linux-gui-connected
      - name: Connect GTK shell to a real PGlite service
        run: clients/linux/tests/run-with-xvfb.sh npm run test:linux-gui-real-service
      - name: Verify GTK accessibility tree and screenshot
        run: clients/linux/tests/run-with-xvfb.sh dbus-run-session -- npm run test:linux-gui-accessibility
      - name: Install and launch the Meson package
        run: clients/linux/tests/run-with-xvfb.sh dbus-run-session -- npm run test:linux-package

  postgres-contract:
    runs-on: ubuntu-latest
    container:
      image: praxis-control-ci:node24-gtk4-v1
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: praxis_test
          POSTGRES_PASSWORD: praxis_test_password
          POSTGRES_DB: praxis_test
        options: >-
          --health-cmd "pg_isready -U praxis_test -d praxis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: postgresql://praxis_test:praxis_test_password@postgres:5432/praxis_test
    steps:
      - name: Checkout authoritative commit
        env:
          GITEA_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin http://<NAS_LAN_IP>:3000/<GITEA_OWNER>/praxis-control.git
          git -c http.extraheader="Authorization: token $GITEA_TOKEN" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm run test:postgres
